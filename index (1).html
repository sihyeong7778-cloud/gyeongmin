<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>경민 강화하기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#070b1c">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Hahmlet:wght@500;600;800&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1c;--sf:rgba(14,20,46,.74);--ink:#eef0fb;--mu:#9aa5cf;--ac:#c8d0e6;--ln:rgba(160,175,230,.3);--ok:#6be3ac;--bad:#ff8a84;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body[data-t="0"]{--ac:#c8d0e6}body[data-t="1"]{--ac:#7fb2ff}body[data-t="2"]{--ac:#6fe3e6}body[data-t="3"]{--ac:#ff7a5c}body[data-t="4"]{--ac:#c58bff}body[data-t="5"]{--ac:#ffd36a}
body{margin:0;color:var(--ink);font:400 15px/1.6 "Noto Sans KR",system-ui,sans-serif;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,color-mix(in srgb,var(--ac) 24%,transparent),transparent 55%),radial-gradient(circle at 85% 12%,rgba(60,80,170,.3),transparent 40%),linear-gradient(#0b1233,#070b1c 60%,#04060f) fixed;transition:--ac .6s}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 120px,#cfe0ff,transparent),radial-gradient(1px 1px at 160px 60px,#fff,transparent),radial-gradient(1px 1px at 230px 170px,#ffe9c8,transparent);background-size:260px 200px;opacity:.7;animation:tw 6s ease-in-out infinite alternate}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:24vh;z-index:0;pointer-events:none;background:linear-gradient(#0b1130,#03050d);clip-path:polygon(0 70%,12% 45%,24% 62%,38% 28%,52% 58%,66% 36%,80% 60%,92% 42%,100% 58%,100% 100%,0 100%)}
@keyframes tw{to{opacity:.3}}
main{position:relative;z-index:2;max-width:460px;margin:0 auto;padding:22px 16px 60px}
h1{font:800 32px/1.2 "Hahmlet",serif;margin:0 0 4px;text-align:center;letter-spacing:.1em;text-shadow:0 0 22px color-mix(in srgb,var(--ac) 60%,transparent)}
.sub{color:var(--mu);font:500 13px "Hahmlet",serif;text-align:center;margin:0 0 18px;letter-spacing:.12em}
.stats{display:flex;gap:8px;margin-bottom:14px}
.stats div{flex:1;background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--mu);backdrop-filter:blur(6px)}
.stats b{display:block;font:700 18px "Hahmlet",serif;color:var(--ink)}
.hero{position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:4px;padding:26px 16px 20px;text-align:center;backdrop-filter:blur(8px);box-shadow:0 0 44px color-mix(in srgb,var(--ac) 22%,transparent),inset 0 0 0 4px rgba(7,11,28,.7),inset 0 0 0 5px var(--ln)}
.lv{font:900 72px/1 "Cinzel Decorative","Hahmlet",serif;color:var(--ac);text-shadow:0 0 28px var(--ac),0 0 60px color-mix(in srgb,var(--ac) 50%,transparent)}
.title{font:800 22px "Hahmlet",serif;margin:10px 0 2px;letter-spacing:.06em}
.rate{color:var(--mu);font-size:13px}
.gauge{height:8px;border-radius:4px;background:rgba(0,0,0,.45);border:1px solid var(--ln);margin:18px 0 14px;overflow:hidden}
.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 40%,transparent),var(--ac));box-shadow:0 0 12px var(--ac)}
.msg{min-height:50px;font:600 15px/1.6 "Hahmlet",serif}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.row{display:flex;gap:8px;margin-top:10px}
button{flex:1;font:500 14px "Noto Sans KR",sans-serif;padding:12px 8px;border-radius:4px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);cursor:pointer;backdrop-filter:blur(6px)}
button:hover:not(:disabled){border-color:var(--ac)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.main{background:linear-gradient(var(--ac),color-mix(in srgb,var(--ac) 65%,#000));color:#0b1020;border-color:var(--ac);font:800 16px "Hahmlet",serif;box-shadow:0 0 18px color-mix(in srgb,var(--ac) 40%,transparent)}
button:disabled{opacity:.4;cursor:default}
small{display:block;font-weight:400;color:var(--mu);font-size:11px}
button.main small{color:rgba(11,16,32,.75)}
#cp{display:none;margin-top:10px;background:var(--sf);border:1px solid var(--ln);border-radius:4px;padding:12px;backdrop-filter:blur(8px)}
#cp input{width:100%;padding:10px;border-radius:4px;border:1px solid var(--ln);background:rgba(0,0,0,.4);color:var(--ink);font:500 15px "Noto Sans KR",sans-serif;margin-bottom:8px;text-transform:uppercase}
.rec{margin-top:18px;color:var(--mu);font-size:12px;text-align:center}
@media(prefers-reduced-motion:reduce){body::before{animation:none}.gauge i{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>경민 강화하기</h1>
<p class="sub">별의 시험을 견딘 자만이 전설이 된다.</p>
<div class="stats">
<div>골드<b id="gold">0</b></div>
<div>방어권<b id="ward">0</b></div>
<div>연속 성공<b id="streak">0</b></div>
</div>
<div class="hero">
<div class="lv" id="lv">+0</div>
<div class="title" id="ttl"></div>
<div class="rate" id="rate"></div>
<div class="gauge"><i id="bar"></i></div>
<div class="msg" id="msg">경민이 별빛 아래 서 있다.</div>
</div>
<div class="row">
<button class="main" id="bEnh"><span id="cEnh"></span><small>강화</small></button>
<button id="bCurse"><span>저주받은 강화</span><small id="cCurse"></small></button>
</div>
<div class="row">
<button id="bSell">판매<small id="cSell"></small></button>
<button id="bGamble">판매가 걸고 도박<small>50%로 2배, 실패 시 파괴</small></button>
</div>
<div class="row">
<button id="bWard">방어권 구매<small>400 골드</small></button>
<button id="bWork">의뢰 수행<small>골드 획득</small></button>
</div>
<div class="row"><button id="bCp">쿠폰 입력</button></div>
<div id="cp">
<input id="cin" placeholder="쿠폰 코드" autocomplete="off" spellcheck="false">
<div class="row" style="margin-top:0"><button class="main" id="cok">인장 새기기</button></div>
<div class="msg" id="cmsg" style="min-height:24px;margin-top:8px;font-size:13px"></div>
</div>
<div class="rec" id="rec"></div>
</main>
<script>
const MAXL=20;
const RATE=[95,92,89,86,83,78,72,66,60,54,48,42,36,31,26,22,18,15,12,10];
const TT=["이름 없는 경민","이름 없는 경민","이름 없는 경민","견습 경민","견습 경민","강철의 경민","강철의 경민","강철의 경민","월광 경민","월광 경민","용살자 경민","용살자 경민","용살자 경민","심연의 경민","심연의 경민","성좌의 경민","성좌의 경민","성좌의 경민","신화의 경민","신화의 경민","세계를 끝내는 경민"];
// 쿠폰은 SHA-256 해시로만 저장 (코드 원문 없음)
const CP={
"4b5fc65de983225d5ade37710e45191f12827173720b131845d41dc6a6e4bbeb":{l:5,w:0},
"3fbb8768b60ed72e5bcb818a7bfe620e10d17e13d0d71fe9be164f3811cfcf60":{l:10,w:1},
"24a5b54e094e902d7fe098f188e1e9826a17982721ac0f1554285ca75fc51bef":{l:15,w:2},
"d416841654ddc55ac99bdb59799212a7e788da3855b6279ea4f080ad382353d7":{l:18,w:3},
"947fbf0f41770839d5ba1e0d7065570991f11829945afad1ee5939372a35c1f7":{g:10000000,o:1},
"a2926cd26e9ce70ba6b0a7d636a17df3d80372da733f89582bdbba14586691be":{l:19,w:3},
"3b962872573fd8dd549b91d7792ce7ce88c628605cc48c37df8eca84219aa6c8":{l:20,w:0}};
const $=id=>document.getElementById(id);
let S={l:0,g:300,w:0,s:0,cp:false,bn:0,bc:0},busy=false;
try{const x=JSON.parse(localStorage.getItem("gm1")||"null");if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem("gm1",JSON.stringify(S))}catch(e){}};
const cost=l=>Math.round(50*Math.pow(1.45,l));
const sell=l=>l?Math.round(30*Math.pow(1.6,l)*(1+Math.min(S.s,10)*.05)):0;
const fmt=n=>n.toLocaleString("ko-KR");
function say(t,c){const m=$("msg");m.textContent=t;m.className="msg "+(c||"")}
function draw(){
 document.body.dataset.t=Math.min(5,Math.floor(S.l/4));$("lv").textContent="+"+S.l;$("ttl").textContent=TT[S.l];
 $("gold").textContent=fmt(S.g);$("ward").textContent=S.w;$("streak").textContent=S.s;
 const max=S.l>=MAXL;
 $("rate").textContent=max?"더 이상 오를 곳이 없다.":"성공 확률 "+RATE[S.l]+"%";
 $("cEnh").textContent=max?"최고 단계":fmt(cost(S.l))+" 골드";
 const cr=max?0:Math.max(3,Math.round(RATE[S.l]/3));
 $("cCurse").textContent=max?"-":cr+"%로 +2~+3단계 · "+fmt(cost(S.l)*2)+"G";
 $("cSell").textContent=S.l?fmt(sell(S.l))+" 골드":"+1부터 가능";
 $("bEnh").disabled=busy||max||S.g<cost(S.l);
 $("bCurse").disabled=busy||max||S.g<cost(S.l)*2;
 $("bSell").disabled=busy||!S.l;$("bGamble").disabled=busy||!S.l;
 $("bWard").disabled=busy||S.g<400;$("bWork").disabled=busy;
 $("rec").textContent="최고 기록 · 일반 +"+S.bn+" / 쿠폰 +"+S.bc;
 save();
}
function record(){if(S.cp){S.bc=Math.max(S.bc,S.l)}else{S.bn=Math.max(S.bn,S.l)}}
function destroy(){
 if(S.w>0){S.w--;S.s=0;say("방어권이 부서졌다. 경민은 간신히 형체를 지켰다.","bad");return}
 S.l=0;S.s=0;S.cp=false;
 if(Math.random()<.05){S.w++;say("…모든 것이 재가 되었다. 잿더미 속에서 불사의 각인이 빛난다. (방어권 +1)","bad")}
 else say("…모든 것이 재가 되었다. 그러나 전설은 끝나지 않는다.","bad");
}
function run(kind){
 if(busy)return;busy=true;
 const l=S.l,c=kind==="curse"?cost(l)*2:cost(l);
 const rate=kind==="curse"?Math.max(3,Math.round(RATE[l]/3)):RATE[l];
 S.g-=c;const win=Math.random()*100<rate;
 const bar=$("bar");bar.style.transition="none";bar.style.width="0%";
 say("별이 응답을 고른다…");draw();
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  bar.style.transition="width .9s cubic-bezier(.3,.7,.4,1)";
  bar.style.width=(win?100:78+Math.random()*18)+"%";
 }));
 setTimeout(()=>{
  if(win){
   const up=kind==="curse"?2+(Math.random()<.5?1:0):1;
   S.l=Math.min(MAXL,l+up);S.s++;record();
   say(up>1?"균열이 하늘을 가른다. 경민이 "+up+"단계를 도약했다.":"별이 응답했다. 경민의 의지가 한 단계 더 벼려졌다.","ok");
  }else{
   S.s=0;const r=Math.random()*100;
   if(kind==="curse"){ if(r<45)destroy(); else{S.l=Math.max(0,l-1);say("저주가 되돌아왔다. 경민이 한 걸음 물러선다.","bad")} }
   else if(l<5)say("균열이 번졌으나, 아직 버틴다.","bad");
   else if(l<10){ if(r<50){S.l=l-1;say("경민의 빛이 흔들린다. 한 걸음 물러선다.","bad")}else say("균열이 번졌으나, 아직 버틴다.","bad") }
   else if(l<15){ if(r<20)destroy(); else if(r<60){S.l=l-1;say("경민의 빛이 흔들린다. 한 걸음 물러선다.","bad")}else say("균열이 번졌으나, 아직 버틴다.","bad") }
   else { if(r<40)destroy(); else if(r<80){S.l=l-1;say("경민의 빛이 흔들린다. 한 걸음 물러선다.","bad")}else say("균열이 번졌으나, 아직 버틴다.","bad") }
  }
  busy=false;draw();
 },1000);
}
$("bEnh").onclick=()=>run("n");
$("bCurse").onclick=()=>run("curse");
$("bSell").onclick=()=>{const p=sell(S.l);S.g+=p;S.l=0;S.s=0;S.cp=false;say(fmt(p)+" 골드를 얻었다. 새로운 경민이 일어선다.","ok");draw()};
$("bGamble").onclick=()=>{
 const p=sell(S.l);
 if(Math.random()<.5){S.g+=p*2;S.l=0;S.s=0;S.cp=false;say("운명이 미소 지었다. "+fmt(p*2)+" 골드를 거머쥐었다.","ok")}
 else{S.l=0;S.s=0;S.cp=false;say("운명이 등을 돌렸다. 경민은 빛 속으로 사라졌다.","bad")}
 draw();
};
$("bWard").onclick=()=>{S.g-=400;S.w++;say("방어권을 손에 넣었다.","ok");draw()};
$("bWork").onclick=()=>{const g=30+Math.floor(Math.random()*40)+S.l*5;S.g+=g;say("의뢰를 마치고 "+g+" 골드를 받았다.");draw()};
$("bCp").onclick=()=>{const p=$("cp");p.style.display=p.style.display==="block"?"none":"block"};
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
$("cok").onclick=async()=>{
 const v=$("cin").value.trim().toUpperCase(),m=$("cmsg");
 if(!v){m.textContent="코드를 입력하세요.";m.className="msg bad";return}
 let h="";try{h=await sha(v)}catch(e){}
 const c=CP[h];
 if(!c){m.textContent="알 수 없는 인장입니다.";m.className="msg bad";return}
 S.u=S.u||[];
 if(c.o&&S.u.includes(h)){m.textContent="이미 사용된 인장입니다.";m.className="msg bad";return}
 if(c.o)S.u.push(h);
 S.w+=c.w||0;S.g+=c.g||0;
 if(c.l!=null){S.l=c.l;S.s=0;S.cp=true;record();say("쿠폰의 힘으로 "+TT[c.l]+"이(가) 깨어났다.","ok");m.textContent="인장이 새겨졌다. +"+c.l+" 경민이 깨어난다."}
 else{say(fmt(c.g)+" 골드가 쏟아져 내렸다.","ok");m.textContent="인장이 새겨졌다. "+fmt(c.g)+" 골드를 얻었다."}
 m.className="msg ok";
 $("cin").value="";draw();
};
draw();
</script>
<script>
(()=>{const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none";document.body.prepend(c);if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const x=c.getContext("2d");let W,H,P=[];function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener("resize",rs);for(let i=0;i<45;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,v:Math.random()*.4+.15,d:Math.random()*6});(function f(t){x.clearRect(0,0,W,H);x.fillStyle=getComputedStyle(document.body).getPropertyValue("--ac").trim()||"#fff";for(const p of P){p.y-=p.v;p.x+=Math.sin(t/1500+p.d)*.3;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}x.globalAlpha=.25+.35*Math.abs(Math.sin(t/900+p.d));x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}requestAnimationFrame(f)})(0)})();
</script>
</body>
</html>
